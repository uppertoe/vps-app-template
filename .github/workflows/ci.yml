name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@d4fc41b967653e441e8d290d3298c9b333b210d3
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
