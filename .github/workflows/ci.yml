name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@8b8e2398e4c104b4cfd44b567fa48907829aa52f
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
