name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@3994d82ab79576bb8ea8cb2236fb7a4f0f7b351e
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
