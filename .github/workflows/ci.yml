name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@b890fe172102992b390420714fdbf29fc7ef151d
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
