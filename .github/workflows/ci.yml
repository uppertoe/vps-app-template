name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@a00b16b388855862ff351bb40f7e90732981f568
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
