name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@b389426d6cdcd8006ffb5f0c4328a9afa4f59c45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
