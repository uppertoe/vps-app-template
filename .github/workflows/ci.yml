name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  ci:
    # The platform's checks, container probe and image publishing. Renovate
    # proposes updates to this pin; a person merges them.
    uses: uppertoe/vps-app-kit/.github/workflows/app-ci.yml@02d8fec78775eb40910521dfaf028eef6fd458a8
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
